name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EPUBCHECK_VERSION: "5.4.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache EPUBCheck
        id: cache-epubcheck
        uses: actions/cache@v4
        with:
          path: .tools/epubcheck
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}

      - name: Download EPUBCheck
        if: steps.cache-epubcheck.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/epubcheck
          curl -fsSL -o /tmp/epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q /tmp/epubcheck.zip -d .tools/epubcheck
          rm -f /tmp/epubcheck.zip

      - name: Run lint, syntax, CSP, i18n, and formatting checks
        run: npm run lint

      - name: Run unit, parser snapshot, and EPUBCheck validation tests
        env:
          REQUIRE_EPUBCHECK: "1"
        run: npm test

      - name: Install Playwright Chromium for E2E test
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Run extension E2E integration test
        env:
          REQUIRE_EPUBCHECK: "1"
        run: npm run test:e2e

      - name: Dry-run extension ZIP package
        run: |
          zip -r WebPullBook-preview.zip manifest.json icons src LICENSE README.md README.en.md docs
          unzip -t WebPullBook-preview.zip
          rm -f WebPullBook-preview.zip
