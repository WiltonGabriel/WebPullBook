name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EPUBCHECK_VERSION: "5.4.0"
  EPUBCHECK_SHA256: "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache EPUBCheck
        id: cache-epubcheck
        uses: actions/cache@v5
        with:
          path: .tools/epubcheck
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}

      - name: Download EPUBCheck
        if: steps.cache-epubcheck.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/epubcheck
          curl -fsSL -o /tmp/epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  /tmp/epubcheck.zip" | sha256sum -c -
          unzip -q /tmp/epubcheck.zip -d .tools/epubcheck
          rm -f /tmp/epubcheck.zip

      - name: Run lint, syntax, CSP, i18n, and formatting checks
        run: npm run lint

      - name: Install Node devDependencies for tests and static linters
        run: npm ci --no-audit --no-fund

      - name: Run Biome static analysis
        run: npm run lint:biome

      - name: Run unit, parser snapshot, and EPUBCheck validation tests
        env:
          REQUIRE_EPUBCHECK: "1"
        run: npm test

      - name: Install Playwright Chromium for E2E test
        run: npx playwright install chromium

      - name: Run extension E2E integration test
        env:
          REQUIRE_EPUBCHECK: "1"
        run: npm run test:e2e

      - name: Setup non-Snap Firefox for MV3 E2E test
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "latest"

      - name: Run Firefox MV3 E2E integration test
        env:
          REQUIRE_EPUBCHECK: "1"
        run: FIREFOX_BIN="$(command -v firefox)" npm run test:e2e:firefox

      - name: Dry-run extension ZIP package & Mozilla addons-linter
        run: |
          zip -9 -r WebPullBook-preview.zip manifest.json _locales icons src LICENSE README.md README.pt.md
          unzip -t WebPullBook-preview.zip
          npx --no-install addons-linter WebPullBook-preview.zip
          rm -f WebPullBook-preview.zip
