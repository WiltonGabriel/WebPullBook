name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/COMPATIBILITY.md"
      - "docs/READER_PRESETS.md"
      - "docs/pt/READER_PRESETS.pt.md"
      - "manifest.json"
      - "package.json"
      - "src/workspace/state.js"
      - "scripts/sync-website.mjs"
      - "scripts/verify-website.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify website synchronization with docs and manifest
        run: node scripts/sync-website.mjs --check

      - name: Validate static website HTML, SEO metadata, links, and sitemap
        run: node scripts/verify-website.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
