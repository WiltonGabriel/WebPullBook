name: Release Extension Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          MANIFEST_VER=$(node -pe "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")
          if [ "$TAG_VER" != "$MANIFEST_VER" ]; then
            echo "Tag version ($TAG_VER) does not match manifest.json version ($MANIFEST_VER)"
            exit 1
          fi
          echo "VERSION=$TAG_VER" >> "$GITHUB_ENV"

      - name: Build extension archive
        run: |
          zip -r "WebPullBook-v${VERSION}.zip" manifest.json icons src LICENSE README.md README.en.md docs
          sha256sum "WebPullBook-v${VERSION}.zip" > "WebPullBook-v${VERSION}.zip.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "WebPullBook-v${VERSION}.zip" \
              "WebPullBook-v${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "WebPullBook-v${VERSION}.zip" \
              "WebPullBook-v${VERSION}.zip.sha256" \
              --title "WebPullBook ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
