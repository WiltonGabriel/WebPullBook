name: Release Extension Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  EPUBCHECK_VERSION: "5.4.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify tag matches manifest and package versions
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          BASE_TAG_VER="${TAG_VER%%-*}"
          MANIFEST_VER=$(node -pe "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")
          MANIFEST_VER_NAME=$(node -pe "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")
          PKG_VER=$(node -pe "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "$BASE_TAG_VER" != "$MANIFEST_VER" ] || [ "$BASE_TAG_VER" != "$PKG_VER" ]; then
            echo "Tag version ($TAG_VER) does not match manifest.json ($MANIFEST_VER) or package.json ($PKG_VER)"
            exit 1
          fi
          IS_PRERELEASE="false"
          RELEASE_TITLE="WebPullBook ${GITHUB_REF_NAME}"
          if echo "${TAG_VER} ${MANIFEST_VER_NAME}" | grep -qiE '(beta|alpha|rc)'; then
            IS_PRERELEASE="true"
            RELEASE_TITLE="WebPullBook ${GITHUB_REF_NAME} (Beta)"
          fi
          echo "VERSION=$TAG_VER" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

      - name: Cache EPUBCheck
        id: cache-epubcheck
        uses: actions/cache@v4
        with:
          path: .tools/epubcheck
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}

      - name: Download EPUBCheck
        if: steps.cache-epubcheck.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/epubcheck
          curl -fsSL -o /tmp/epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q /tmp/epubcheck.zip -d .tools/epubcheck
          rm -f /tmp/epubcheck.zip

      - name: Run pre-release lint, unit tests, and EPUBCheck
        env:
          REQUIRE_EPUBCHECK: "1"
        run: npm run check

      - name: Install Playwright Chromium & run pre-release E2E test
        env:
          REQUIRE_EPUBCHECK: "1"
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          npm run test:e2e

      - name: Prepare release notes from CHANGELOG.md
        run: |
          if node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" /tmp/release-notes.md; then
            echo "HAS_CHANGELOG_NOTES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_CHANGELOG_NOTES=false" >> "$GITHUB_ENV"
          fi

      - name: Build extension archive
        run: |
          zip -r "WebPullBook-v${VERSION}.zip" manifest.json icons src LICENSE README.md README.en.md docs
          sha256sum "WebPullBook-v${VERSION}.zip" > "WebPullBook-v${VERSION}.zip.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "WebPullBook-v${VERSION}.zip" \
              "WebPullBook-v${VERSION}.zip.sha256" \
              --clobber
            if [ "$HAS_CHANGELOG_NOTES" = "true" ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --title "${RELEASE_TITLE}" \
                --notes-file /tmp/release-notes.md \
                $PRERELEASE_FLAG
            else
              gh release edit "${GITHUB_REF_NAME}" \
                --title "${RELEASE_TITLE}" \
                $PRERELEASE_FLAG
            fi
          else
            if [ "$HAS_CHANGELOG_NOTES" = "true" ]; then
              gh release create "${GITHUB_REF_NAME}" \
                "WebPullBook-v${VERSION}.zip" \
                "WebPullBook-v${VERSION}.zip.sha256" \
                --title "${RELEASE_TITLE}" \
                --notes-file /tmp/release-notes.md \
                $PRERELEASE_FLAG
            else
              gh release create "${GITHUB_REF_NAME}" \
                "WebPullBook-v${VERSION}.zip" \
                "WebPullBook-v${VERSION}.zip.sha256" \
                --title "${RELEASE_TITLE}" \
                --generate-notes \
                $PRERELEASE_FLAG
            fi
          fi
