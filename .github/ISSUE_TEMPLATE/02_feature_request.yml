name: Feature Request
description: Suggest a new feature, reader preset, or export improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Workspace UI
        - Export Formats & Reader Presets
        - Library & Cache
        - Network / Rate Limiter / DNR
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see added.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem / Use Case
      description: Explain what problem this solves or how it improves your workflow.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Suggested Implementation (optional)
      description: Share any ideas, mockups, or references.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues to make sure this has not already been requested.
          required: true
