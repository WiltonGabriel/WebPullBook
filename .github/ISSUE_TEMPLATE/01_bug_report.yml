name: Bug Report
description: Report an extraction error, export formatting issue, or extension bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium (Edge, Brave, Vivaldi, Opera)
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Export Format Involved
      options:
        - Not applicable (Extraction / UI / Cache)
        - EPUB
        - HTML
        - Markdown
        - TXT
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL (optional)
      placeholder: "https://example.com/book/chapter-1"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
  - type: textarea
    id: logs
    attributes:
      label: Workspace / Console Logs (optional)
      description: Paste relevant logs from the workspace logger or browser DevTools.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues to avoid duplicates.
          required: true
        - label: I tested with the latest available version of WebPullBook.
          required: false
