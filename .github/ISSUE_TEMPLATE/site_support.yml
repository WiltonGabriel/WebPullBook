name: Parser / Adapter Support
description: Request a new site parser or report a broken adapter
labels: ["parser"]
body:
  - type: input
    id: site_name
    attributes:
      label: Site Name & Domain
      placeholder: e.g. Example Site (example.com)
    validations:
      required: true
  - type: input
    id: index_url
    attributes:
      label: Example Index / Table of Contents URL
      placeholder: https://example.com/book/123
    validations:
      required: true
  - type: input
    id: chapter_url
    attributes:
      label: Example Chapter / Page URL
      placeholder: https://example.com/book/123/chapter-1
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Mention pagination, anti-bot protection, or special formatting.
