name: Feature Request
description: Suggest a new feature or export format
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see added.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use Case
      description: Explain why this feature would be useful.
