name: Documentation
description: Report an error, outdated info, or improvement in repository docs
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      options:
        - Missing information
        - Outdated instructions
        - Typo / Grammar
        - Translation discrepancy (EN / PT)
    validations:
      required: true
  - type: input
    id: doc_path
    attributes:
      label: Document / File Path
      placeholder: "e.g. README.md, docs/READER_PRESETS.md, CONTRIBUTING.md"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details & Suggested Fix
      description: Describe what is missing, wrong, or unclear.
    validations:
      required: true
