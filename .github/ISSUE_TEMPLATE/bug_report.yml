name: Bug Report
description: Report an extraction error, EPUB formatting issue, or extension bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL (optional)
      placeholder: https://example.com/story/chapter-1
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & Extension Version
      placeholder: e.g. Firefox 132 / Chrome 131, WebPullBook v1.0.0
